<p-toast></p-toast>

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  (onHide)="close()"
  [style]="{ width: '95vw', maxWidth: '1200px' }"
  styleClass="!rounded-xl"
  [header]="'Ingresar Unidades' + (producto ? ' — ' + producto.name : '')">

  <div class="flex flex-col gap-5 pt-1">

    <!-- Sede + Bodega selectors -->
    <div class="flex flex-col md:flex-row gap-4 md:flex-wrap">
      <div class="flex flex-col gap-1 w-full md:min-w-[200px] md:w-auto md:flex-1">
        <label class="text-xs font-semibold text-surface-600 uppercase tracking-wide">Sede *</label>
        <p-dropdown
          [(ngModel)]="selectedSedeId"
          [options]="sedes"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Seleccionar sede"
          (onChange)="onSedeChange()"
          styleClass="w-full">
        </p-dropdown>
      </div>
      <div class="flex flex-col gap-1 w-full md:min-w-[200px] md:w-auto md:flex-1" *ngIf="bodegas.length > 0">
        <label class="text-xs font-semibold text-surface-600 uppercase tracking-wide">Bodega <span class="text-surface-400 normal-case font-normal">(opcional)</span></label>
        <p-dropdown
          [(ngModel)]="selectedBodegaId"
          [options]="bodegas"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Principal por defecto"
          [showClear]="true"
          styleClass="w-full">
        </p-dropdown>
      </div>
    </div>

    <!-- Table form -->
    <div class="overflow-x-auto rounded-xl border border-surface-200">
      <table class="w-full text-sm border-collapse">
        <thead>
          <tr class="bg-surface-50 border-b border-surface-200">
            <th class="px-3 py-2.5 text-left text-xs font-semibold text-surface-500 uppercase tracking-wide whitespace-nowrap">Identificador (IMEI/serial)</th>
            <th class="px-3 py-2.5 text-left text-xs font-semibold text-surface-500 uppercase tracking-wide whitespace-nowrap">P. Venta</th>
            <th class="px-3 py-2.5 text-left text-xs font-semibold text-surface-500 uppercase tracking-wide whitespace-nowrap">P. Costo</th>
            <th class="px-3 py-2.5 w-8"></th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let row of rows; let i = index"
              class="border-b border-surface-100 hover:bg-surface-50 transition-colors">
            <td class="px-2 py-1.5">
              <input [(ngModel)]="row.identifier" (input)="preview = null"
                     placeholder="IMEI para celulares/tablets, serial/S-N para el resto"
                     class="w-full min-w-[220px] px-2 py-1.5 rounded-lg border border-surface-200 text-sm font-mono focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-white" />
            </td>
            <td class="px-2 py-1.5">
              <input type="number" [(ngModel)]="row.precioVenta" (input)="preview = null"
                     placeholder="0" class="w-full min-w-[100px] px-2 py-1.5 rounded-lg border border-surface-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-white" />
            </td>
            <td class="px-2 py-1.5">
              <input type="number" [(ngModel)]="row.precioCosto" (input)="preview = null"
                     placeholder="0" class="w-full min-w-[100px] px-2 py-1.5 rounded-lg border border-surface-200 text-sm focus:outline-none focus:ring-2 focus:ring-primary-400 focus:border-transparent bg-white" />
            </td>
            <td class="px-2 py-1.5">
              <button (click)="removeRow(i)"
                      class="w-7 h-7 flex items-center justify-center rounded-lg text-surface-400 hover:text-red-500 hover:bg-red-50 transition-colors"
                      [pTooltip]="'Eliminar fila'" tooltipPosition="left">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
                </svg>
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Add row button -->
    <div>
      <button (click)="addRow()"
              class="flex items-center gap-2 px-3 py-2 text-sm text-primary-600 hover:text-primary-700 hover:bg-primary-50 rounded-lg transition-colors font-medium">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
        Agregar fila
      </button>
    </div>

    <!-- Preview panel -->
    <div *ngIf="preview" class="bg-surface-50 border border-surface-200 rounded-xl p-4 flex flex-col gap-3">

      <!-- Summary -->
      <div class="flex flex-wrap gap-4 text-sm font-medium">
        <span class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-primary-500"></span>
          <span class="text-surface-700">{{ preview.resumen?.totalUnidades }} unidades</span>
        </span>
        <span *ngIf="preview.resumen?.errores > 0" class="flex items-center gap-1.5">
          <span class="w-2 h-2 rounded-full bg-red-500"></span>
          <span class="text-red-600 font-semibold">{{ preview.resumen?.errores }} errores</span>
        </span>
      </div>

      <!-- Unit list -->
      <div class="flex flex-col gap-1 max-h-52 overflow-y-auto">
        <div *ngFor="let u of preview.unidades"
             class="flex items-center justify-between px-3 py-2 rounded-lg text-sm"
             [class.bg-red-50]="u.error"
             [class.border-red-200]="u.error"
             [class.border]="u.error"
             [class.bg-white]="!u.error"
             [class.border-surface-100]="!u.error"
             [class.border]="!u.error">
          <div class="flex items-center gap-2 min-w-0">
            <span class="text-xs px-1.5 py-0.5 rounded font-semibold shrink-0"
                  [class.bg-teal-100]="!u.error"
                  [class.text-teal-700]="!u.error"
                  [class.bg-red-100]="u.error"
                  [class.text-red-700]="u.error">
              {{ u.error ? 'Error' : 'OK' }}
            </span>
            <span *ngIf="u.identifier" class="text-surface-800 font-mono text-xs shrink-0">{{ u.identifier }}</span>
          </div>
          <div class="flex items-center gap-3 shrink-0 ml-3">
            <span *ngIf="u.error" class="text-red-600 text-xs">{{ u.error }}</span>
          </div>
        </div>
      </div>

    </div>

  </div>

  <ng-template pTemplate="footer">
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-2 pt-2">
      <button pButton label="Cancelar" class="p-button-text p-button-secondary" (click)="close()"></button>
      <div class="flex flex-wrap gap-2">
        <button pButton
                label="Previsualizar"
                icon="pi pi-eye"
                class="p-button-outlined flex-1 md:flex-none"
                [loading]="loadingPreview"
                [disabled]="!canAction || loadingPreview || loadingSave"
                (click)="previsualize()">
        </button>
        <button pButton
                label="Confirmar ingreso"
                icon="pi pi-check"
                class="flex-1 md:flex-none"
                [loading]="loadingSave"
                [disabled]="!canAction || loadingPreview || loadingSave"
                (click)="confirm()">
        </button>
      </div>
    </div>
  </ng-template>

</p-dialog>
