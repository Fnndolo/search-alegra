<!-- Trigger -->
<button type="button"
        class="w-full flex items-center gap-2 px-3 py-2 border border-surface-300 rounded-lg bg-white text-sm text-left hover:border-surface-400 transition-colors"
        (click)="toggle($event)">
  <span class="inline-block w-4 h-4 rounded-full border border-surface-300 shrink-0"
        [ngStyle]="swatchStyle(selectedColor)"></span>
  <span class="flex-1 truncate" [class.text-surface-400]="!selectedColor">
    {{ selectedColor?.name || placeholder }}
  </span>
  <i class="pi pi-chevron-down text-xs text-surface-400"></i>
</button>

<!-- appendTo="body": este picker vive dentro de modales (nuevo producto, importar producto) cuyo
     propio scroll/overflow recortaba o desplazaba un panel posicionado localmente. Flotando sobre
     el body, es independiente del layout del modal que lo contiene. -->
<p-popover #op [appendTo]="'body'" [style]="{ width: '24rem', maxWidth: '92vw' }">
  <div class="relative flex flex-col -m-2">
    <div class="p-2 border-b border-surface-100">
      <input type="text" [(ngModel)]="filterText" placeholder="Buscar color..."
             class="w-full text-sm px-2 py-1.5 border border-surface-200 rounded outline-none focus:border-primary-400" />
    </div>

    <!-- Marco de tamaño FIJO (no max-height) — los colores se deslizan adentro, el botón
         "Crear nuevo" de abajo queda siempre en el mismo lugar sin importar cuántos colores haya. -->
    <div class="h-[26rem] overflow-y-auto">
      <div *ngIf="loadingColors" class="px-3 py-3 text-xs text-surface-400 flex items-center gap-2">
        <i class="pi pi-spin pi-spinner"></i> Cargando colores...
      </div>
      <div *ngIf="!loadingColors && !filteredColors.length" class="px-3 py-3 text-xs text-surface-400">
        Sin colores{{ filterText ? ' para "' + filterText + '"' : '' }}.
      </div>
      <div *ngFor="let c of filteredColors"
           class="flex items-center gap-2 px-3 py-2.5 hover:bg-surface-50 cursor-pointer"
           (click)="selectColor(c)">
        <span class="inline-block w-5 h-5 rounded-full border border-surface-300 shrink-0"
              [ngStyle]="swatchStyle(c)"></span>
        <span class="text-sm text-surface-700 truncate">{{ c.name }}</span>
      </div>
    </div>

    <div class="border-t border-surface-100 p-1.5">
      <button type="button" (click)="startCreate()"
              class="w-full flex items-center justify-center gap-1.5 text-sm font-medium text-primary-600 hover:bg-primary-50 rounded-md py-1.5 transition-colors">
        <i class="pi pi-plus text-xs"></i> Crear nuevo
      </button>
    </div>

    <!-- Hijo del popover (no un p-dialog aparte): se apila naturalmente encima de la lista sin
         pelear con el z-index de dos overlays de PrimeNG distintos compitiendo entre sí. -->
    <div *ngIf="creatingNew" class="absolute inset-0 bg-white rounded-lg flex flex-col p-4 gap-3 z-10">
      <div class="flex items-center justify-between">
        <span class="text-sm font-semibold text-surface-700">Crear color nuevo</span>
        <button type="button" (click)="cancelCreate()" class="text-surface-400 hover:text-surface-600">
          <i class="pi pi-times"></i>
        </button>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-surface-500 uppercase tracking-wide">Nombre</label>
        <input type="text" [(ngModel)]="newColorName" placeholder="Ej: Azul cielo"
               class="w-full text-sm px-2 py-1.5 border border-surface-200 rounded outline-none focus:border-primary-400" />
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-xs font-semibold text-surface-500 uppercase tracking-wide">Color aproximado</label>
        <div class="flex items-center gap-2">
          <input type="color" [(ngModel)]="newColorHex" class="w-9 h-9 p-0 border-0 rounded cursor-pointer shrink-0" />
          <span class="text-xs font-mono text-surface-500">{{ newColorHex }}</span>
        </div>
      </div>

      <p *ngIf="createError" class="text-xs text-red-500">{{ createError }}</p>

      <div class="flex justify-end gap-2 mt-auto">
        <button type="button" (click)="cancelCreate()"
                class="text-sm px-3 py-1.5 rounded-md border border-surface-200 text-surface-600 hover:bg-surface-50">
          Cancelar
        </button>
        <button type="button" (click)="saveNewColor()" [disabled]="creating"
                class="text-sm px-3 py-1.5 rounded-md bg-primary-500 text-white hover:bg-primary-600 disabled:opacity-50 flex items-center gap-1.5">
          <i *ngIf="creating" class="pi pi-spin pi-spinner text-xs"></i>
          Crear y usar
        </button>
      </div>
    </div>
  </div>
</p-popover>
