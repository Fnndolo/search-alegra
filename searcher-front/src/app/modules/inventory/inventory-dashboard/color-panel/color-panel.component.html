<p-toast></p-toast>

<div class="bg-white border border-surface-200 rounded-xl shadow-sm overflow-hidden">
  <div class="px-5 py-4 border-b border-surface-100 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
    <div>
      <h3 class="font-semibold text-surface-900">Colores</h3>
      <p class="text-xs text-surface-400 mt-0.5">{{ colors.length }} registrados</p>
    </div>
    <div class="flex flex-wrap gap-2">
      <button pButton type="button" label="Crear color" icon="pi pi-plus" size="small" [outlined]="true"
              (click)="openCreateForm()"></button>
      <button pButton type="button" icon="pi pi-refresh" size="small" severity="secondary" [text]="true"
              [loading]="loading" (click)="loadColors()" pTooltip="Recargar"></button>
    </div>
  </div>

  <div *ngIf="showCreateForm" class="px-5 py-4 border-b border-surface-100 bg-surface-50 flex flex-col sm:flex-row sm:items-center gap-2">
    <div class="flex items-center gap-2">
      <input type="color" [(ngModel)]="createForm.hexCode" class="w-8 h-8 p-0 border-0 rounded cursor-pointer shrink-0" />
      <input pInputText [(ngModel)]="createForm.name" placeholder="Nombre del color" class="text-sm flex-1 w-full" />
    </div>
    <div class="flex flex-wrap gap-2 sm:ml-auto">
      <button pButton type="button" label="Cancelar" size="small" severity="secondary" [text]="true" (click)="cancelCreate()"></button>
      <button pButton type="button" label="Crear" size="small" [loading]="creating" (click)="createColor()"></button>
    </div>
  </div>

  <div *ngIf="loading" class="flex items-center gap-2 px-5 py-8 text-surface-400 text-sm">
    <i class="pi pi-spin pi-spinner"></i>
    <span>Cargando colores...</span>
  </div>

  <div *ngIf="!loading" class="p-5 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3">
    <div *ngFor="let c of colors" class="border border-surface-200 rounded-lg p-3 flex flex-col gap-2">

      <ng-container *ngIf="editingId !== c.id">
        <div class="flex items-center gap-2">
          <span class="inline-block w-6 h-6 rounded-full border border-surface-300 shrink-0"
                [ngStyle]="{ background: c.hexCode || '#e5e7eb' }"></span>
          <span class="text-sm font-medium text-surface-800 truncate">{{ c.name }}</span>
        </div>
        <div class="flex justify-end">
          <button pButton type="button" icon="pi pi-pencil" size="small" severity="info" [text]="true"
                  pTooltip="Editar" (click)="startEdit(c)"></button>
        </div>
      </ng-container>

      <ng-container *ngIf="editingId === c.id">
        <div class="flex items-center gap-2">
          <input type="color" [(ngModel)]="editForm.hexCode" class="w-8 h-8 p-0 border-0 rounded cursor-pointer" />
          <input pInputText [(ngModel)]="editForm.name" class="w-full text-sm" />
        </div>
        <div class="flex justify-end gap-1">
          <button pButton type="button" label="Cancelar" size="small" severity="secondary" [text]="true" (click)="cancelEdit()"></button>
          <button pButton type="button" label="Guardar" size="small" [loading]="saving" (click)="saveEdit(c)"></button>
        </div>
      </ng-container>

    </div>

    <div *ngIf="!colors.length" class="col-span-full text-center text-surface-400 text-sm py-8">
      Sin colores registrados todavía.
    </div>
  </div>
</div>
