<p-toast></p-toast>

<!-- Modals -->
<app-product-form-modal
  [(visible)]="showProductForm"
  [storeId]="selectedSedeFilter"
  (saved)="loadProductos()">
</app-product-form-modal>

<app-ingreso-modal
  [(visible)]="showIngreso"
  [producto]="selectedProducto"
  [sedes]="sedes"
  (saved)="onIngresoSaved()">
</app-ingreso-modal>

<app-imei-search-modal [(visible)]="showImeiSearch"></app-imei-search-modal>

<div class="flex-1 flex flex-col p-3 md:p-5">

    <!-- ══════════════════════════════════════════════ -->
    <!-- TAB: PRODUCTOS                                 -->
    <!-- ══════════════════════════════════════════════ -->
    <div *ngIf="activeTab === 'productos'" class="flex-1 flex flex-col gap-4 animate-fade-in">

      <!-- Filters bar -->
      <div class="flex flex-col md:flex-row md:flex-wrap gap-2 md:items-center">
        <p-dropdown
          [(ngModel)]="selectedSedeFilter"
          [options]="sedesOptions"
          optionLabel="nombre"
          optionValue="id"
          placeholder="Elegir sede..."
          (onChange)="onSedeFilterChange()"
          styleClass="w-full md:w-auto md:min-w-[180px]">
        </p-dropdown>

        <p-iconfield class="w-full md:flex-1 md:min-w-[200px] md:max-w-sm">
          <p-inputicon styleClass="pi pi-search" />
          <input pInputText
                 [(ngModel)]="searchValue"
                 (ngModelChange)="onSearchChange()"
                 placeholder="Buscar por nombre o SKU..."
                 class="w-full" />
        </p-iconfield>

        <div class="flex flex-wrap gap-2 md:ml-auto">
          <button pButton
                  label="Buscar IMEI"
                  icon="pi pi-qrcode"
                  class="p-button-outlined p-button-secondary flex-1 md:flex-none"
                  (click)="showImeiSearch = true">
          </button>
          <button pButton
                  label="Nuevo Producto"
                  icon="pi pi-plus"
                  class="flex-1 md:flex-none"
                  [disabled]="!selectedSedeFilter"
                  (click)="showProductForm = true">
          </button>
        </div>
      </div>

      <!-- Empty state: no sede selected yet -->
      <div *ngIf="!selectedSedeFilter" class="flex-1 flex flex-col items-center justify-center text-center py-16 bg-white border border-surface-200 rounded-xl shadow-sm">
        <i class="pi pi-map-marker text-3xl mb-3 block opacity-30"></i>
        <p class="text-sm text-surface-400">Seleccioná una sede para ver sus productos.</p>
      </div>

      <!-- Products table -->
      <div *ngIf="selectedSedeFilter" class="flex-1 bg-white border border-surface-200 rounded-xl shadow-sm overflow-hidden overflow-x-auto">
        <p-table
          [value]="productos"
          [loading]="loadingProductos"
          [rows]="rows"
          [totalRecords]="totalProductos"
          [lazy]="true"
          (onLazyLoad)="onPageChange($event)"
          [paginator]="totalProductos > rows"
          [rowsPerPageOptions]="[10, 20, 50]"
          styleClass="p-datatable-sm"
          [tableStyle]="{ 'min-width': '600px' }">

          <ng-template pTemplate="header">
            <tr>
              <th class="text-xs uppercase tracking-wide text-surface-500 font-semibold">Nombre</th>
              <th class="text-xs uppercase tracking-wide text-surface-500 font-semibold">Categoría</th>
              <th class="text-xs uppercase tracking-wide text-surface-500 font-semibold">Tipo</th>
              <th class="text-xs uppercase tracking-wide text-surface-500 font-semibold">Colores</th>
            </tr>
          </ng-template>

          <ng-template pTemplate="body" let-producto>
            <tr class="hover:bg-surface-50 transition-colors cursor-pointer"
                (click)="verDetalle(producto)">
              <td>
                <div class="font-medium text-surface-900">{{ producto.name }}</div>
              </td>
              <td class="text-sm text-surface-600">{{ producto.category?.name || '—' }}</td>
              <td>
                <span *ngIf="esSinVariantes(producto)" class="text-xs px-2 py-0.5 rounded-full font-medium bg-surface-100 text-surface-600">
                  Sin identificador
                </span>
                <span *ngIf="!esSinVariantes(producto)" class="text-xs px-2 py-0.5 rounded-full font-medium bg-blue-100 text-blue-700">
                  Con identificador
                </span>
              </td>
              <td>
                <div *ngIf="producto.variants?.length; else sinColores" class="flex items-center gap-1">
                  <span *ngFor="let v of producto.variants"
                        class="inline-block w-4 h-4 rounded-full border border-surface-300 shrink-0"
                        [pTooltip]="v.color?.name || 'Sin color'"
                        [ngStyle]="{ background: (v.color?.hexCode || v.color?.hex_code) || '#d1d5db' }">
                  </span>
                </div>
                <ng-template #sinColores>
                  <span class="text-xs text-surface-400">—</span>
                </ng-template>
              </td>
            </tr>
          </ng-template>

          <ng-template pTemplate="emptymessage">
            <tr>
              <td colspan="4" class="text-center py-12 text-surface-400">
                <i class="pi pi-box text-3xl mb-3 block opacity-30"></i>
                <p class="text-sm">No se encontraron productos.</p>
              </td>
            </tr>
          </ng-template>

        </p-table>
      </div>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- TAB: PENDIENTES (productos por importar de Alegra + ventas sin sincronizar) -->
    <!-- ══════════════════════════════════════════════ -->
    <div *ngIf="activeTab === 'pendientes'" class="flex-1 flex flex-col gap-6 animate-fade-in w-full">
      <app-sale-sync-logs></app-sale-sync-logs>
      <app-import-drafts-panel [sedes]="sedes" [categorias]="categorias"></app-import-drafts-panel>
    </div>

    <!-- ══════════════════════════════════════════════ -->
    <!-- TAB: CATÁLOGOS                                 -->
    <!-- ══════════════════════════════════════════════ -->
    <div *ngIf="activeTab === 'catalogos'" class="flex-1 flex flex-col gap-6 animate-fade-in w-full">
      <app-catalogo-panel
        [categorias]="categorias"
        (changed)="reloadCatalogs()">
      </app-catalogo-panel>
      <app-bodega-panel [sedes]="sedes"></app-bodega-panel>
      <app-color-panel></app-color-panel>
    </div>

</div>
