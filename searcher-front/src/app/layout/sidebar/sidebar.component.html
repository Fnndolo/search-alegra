<!-- Mobile overlay backdrop -->
<div class="fixed inset-0 bg-surface-900/50 z-40 md:hidden transition-opacity duration-300"
  [class.opacity-100]="isMobileMenuOpen()" [class.opacity-0]="!isMobileMenuOpen()"
  [class.pointer-events-none]="!isMobileMenuOpen()" (click)="closeMobileMenu()">
</div>

<div
  class="flex flex-col h-screen bg-surface-900 text-surface-0 border-r border-surface-700 fixed left-0 top-0 z-50 shadow-xl overflow-hidden transition-all duration-300 transform md:translate-x-0"
  [class.w-64]="isExpanded() || isMobileMenuOpen()" [class.md:w-16]="!isExpanded() && !isMobileMenuOpen()"
  [class.-translate-x-full]="!isMobileMenuOpen()" [class.translate-x-0]="isMobileMenuOpen()"
  (mouseenter)="onMouseEnter()" (mouseleave)="onMouseLeave()">

  <!-- Header / Logo -->
  <div class="h-16 flex items-center justify-between px-3 border-b border-surface-800 shrink-0">
    <div class="flex items-center gap-3 overflow-hidden">
      <!-- Logo icon -->
      <div
        class="min-w-[32px] w-8 h-8 rounded-lg bg-primary-500 flex items-center justify-center text-white font-bold text-base shadow-lg shadow-primary-500/30 shrink-0">
        S
      </div>
      <!-- Brand name — fade in/out -->
      <span class="font-bold text-lg whitespace-nowrap tracking-wide select-none transition-opacity duration-200"
        [class.opacity-100]="isExpanded()" [class.opacity-0]="!isExpanded()">Smart Alegra</span>
    </div>

    <!-- Pin/Unpin button — only visible when expanded on desktop -->
    <button *ngIf="isExpanded()" (click)="togglePin()"
      class="hidden md:flex w-8 h-8 rounded-lg items-center justify-center transition-colors shrink-0"
      [class.text-white]="isPinned()" [class.bg-surface-700]="isPinned()" [class.text-surface-400]="!isPinned()"
      [class.hover:bg-surface-800]="!isPinned()" [pTooltip]="isPinned() ? 'Ocultar menú' : 'Fijar menú'"
      tooltipPosition="left">
      <svg *ngIf="isPinned()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m18.75 4.5-7.5 7.5 7.5 7.5m-6-15L5.25 12l7.5 7.5" />
      </svg>
      <svg *ngIf="!isPinned()" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="m5.25 4.5 7.5 7.5-7.5 7.5m6-15 7.5 7.5-7.5 7.5" />
      </svg>
    </button>

    <!-- Close mobile button -->
    <button *ngIf="isMobileMenuOpen()" (click)="closeMobileMenu()"
      class="md:hidden w-8 h-8 rounded-lg flex items-center justify-center text-surface-400 hover:text-white hover:bg-surface-700 transition-colors shrink-0">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-4 h-4">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Navigation Items -->
  <div class="flex-1 overflow-y-auto overflow-x-hidden py-5 flex flex-col gap-1 px-2 custom-scrollbar">
    <ng-container *ngFor="let item of filteredMenuItems()">

      <!-- Main Item (Parent or Single) -->
      <div class="flex flex-col">
        <a [routerLink]="item.children ? null : item.route"
          (click)="item.children ? toggleSubMenu(item.route, $event) : closeMobileIfOpen()"
          class="flex items-center gap-3 px-3 py-3 rounded-xl transition-all duration-150 cursor-pointer group relative"
          [class.bg-primary-500]="isActive(item.route) && !item.children"
          [class.text-white]="isActive(item.route) && !item.children"
          [class.text-surface-300]="!(isActive(item.route) && !item.children)"
          [pTooltip]="!isExpanded() && !isMobileMenuOpen() ? item.label : ''" tooltipPosition="right">

          <span *ngIf="!(isActive(item.route) && !item.children)"
            class="absolute inset-0 rounded-xl bg-surface-800 opacity-0 group-hover:opacity-100 transition-opacity duration-150">
          </span>

          <!-- Switch for main icons -->
          <span class="relative z-10 w-6 flex justify-center">
            <svg *ngIf="item.label === 'Buscador de Facturas'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
            </svg>
            <svg *ngIf="item.label === 'Facturación Electrónica'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z" />
            </svg>
            <svg *ngIf="item.label === 'Usuarios'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
              <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" />
            </svg>
          </span>

          <span class="whitespace-nowrap font-medium select-none relative z-10 transition-opacity duration-200 flex-1"
            [class.opacity-100]="isExpanded() || isMobileMenuOpen()"
            [class.opacity-0]="!isExpanded() && !isMobileMenuOpen()">
            {{ item.label }}
          </span>

          <!-- Chevron for children SVG -->
          <svg *ngIf="item.children && (isExpanded() || isMobileMenuOpen())" 
            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="3" stroke="currentColor" 
            class="w-3 h-3 transition-transform duration-200" [class.rotate-180]="isOpen(item.route)">
            <path stroke-linecap="round" stroke-linejoin="round" d="m19.5 8.25-7.5 7.5-7.5-7.5" />
          </svg>
        </a>

        <!-- Children Container -->
        <div *ngIf="item.children && isOpen(item.route) && (isExpanded() || isMobileMenuOpen())"
          class="flex flex-col mt-1 ml-4 border-l border-surface-700 pl-2 gap-1 animate-fade-in">
          <a *ngFor="let child of item.children" [routerLink]="child.route" (click)="closeMobileIfOpen()"
            class="flex items-center gap-3 px-3 py-2 rounded-lg transition-all duration-150 cursor-pointer group relative text-sm"
            [class.bg-surface-800]="isActive(child.route, true)" [class.text-primary-400]="isActive(child.route, true)"
            [class.text-surface-400]="!isActive(child.route, true)">
            <!-- Child icons SVGs -->
            <svg *ngIf="child.label === 'Módulo Principal'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
            </svg>
            <svg *ngIf="child.label === 'Estandarizar Items'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75Zm.007 5.25H3.75v.008h.007V12Zm0 5.25H3.75v.008h.007v-.008Z" />
            </svg>
            <svg *ngIf="child.label === 'Estandarizar Bancos'" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 21v-8.25M15.75 21v-8.25M8.25 21v-8.25M3 9l9-6 9 6m-1.5 12V10.332A48.36 48.36 0 0 0 12 9.75c-2.551 0-5.056.2-7.5.582V21M3 21h18" />
            </svg>
            <span>{{ child.label }}</span>
          </a>
        </div>
      </div>

    </ng-container>
  </div>

</div>
